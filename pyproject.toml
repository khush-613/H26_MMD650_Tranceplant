[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tranceplant"
version = "0.1.0"
description = "Swap risky Python dependencies in a sandbox, test both sides, and ship the evidence as a Dependency Exit Capsule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "packaging>=24",
    "google-genai>=1.0",
    "libcst>=1.4",
    "jinja2>=3.1",
    "httpx>=0.27",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tranceplant = "tranceplant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tranceplant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = [
    "integration: runs LinkWatch's real test suite in uv virtual environments (slow, needs network)",
]
